name: express-api-boilerplate

on:
  push:
    branches: [main]
    paths:
      - "apps/express-api-boilerplate/**"
      - ".github/workflows/express-api.yml"
  pull_request:
    paths:
      - "apps/express-api-boilerplate/**"
      - ".github/workflows/express-api.yml"
  schedule:
    - cron: "0 18 * * *" # every day, 02:00 Singapore time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/express-api-boilerplate

jobs:
  verify:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: express_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUSKY: "0"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/express_api?schema=public
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/express-api-boilerplate/package-lock.json

      - name: Install
        run: npm ci

      # Lint and typecheck need the generated Prisma client types.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npm run db:deploy

      - name: Unit and integration tests
        run: npm run test:unit:run

      # The e2e project only makes HTTP requests, so no browser is installed.
      - name: End-to-end tests
        run: npm run test:e2e
